<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Admin Dashboard | Dutabarane</title>
    
    <!-- ==================== EXTERNAL RESOURCES ==================== -->
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Loader CSS -->
    <link rel="stylesheet" href="loaders.css">
    
    <!-- ==================== STYLES ==================== -->
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f17;
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(74, 158, 255, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 5% 10%, #3b82f6, transparent),
                              radial-gradient(2px 2px at 15% 70%, #4a9eff, transparent),
                              radial-gradient(3px 3px at 25% 40%, #2a7fff, transparent);
            background-size: 200% 200%;
            opacity: 0.2;
            animation: particles 25s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        /* ===== NAVIGATION BAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #3b82f6;
            padding: 12px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #b8d1ff;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(59, 130, 246, 0.2);
            color: white;
        }

        .logout-btn {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444 !important;
        }

        .logout-btn:hover {
            background: #ff4444;
            color: white !important;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 15px 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== SECTIONS ===== */
        .left-section,
        .right-section {
            flex: 1 1 45%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== CARDS ===== */
        .card {
            background: rgba(5, 12, 24, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 100, 200, 0.3);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #3b82f6;
        }

        /* ===== TYPOGRAPHY ===== */
        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== FORM ELEMENTS ===== */
        input, .search {
            padding: 10px 12px;
            margin: 6px 0;
            width: 100%;
            background: rgba(10, 25, 45, 0.6);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus, .search:focus {
            border-color: #3b82f6;
            outline: none;
        }

        /* Colored Inputs */
        .amount-input { border-color: #00c853; }
        .loan-input { border-color: #ff9100; }
        .interest-input { border-color: #2979ff; }

        /* ===== BUTTONS ===== */
        button {
            padding: 12px 16px;
            margin: 8px 0;
            width: 100%;
            background: linear-gradient(145deg, #002244, #001433);
            border: 2px solid #2a7fff;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(145deg, #003366, #001f4d);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Toggle Button */
        .toggle-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid #3b82f6;
            border-radius: 30px;
            padding: 10px 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* Action Buttons */
        .action-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            color: #3b82f6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .action-btn.delete-btn {
            border-color: #ff4444;
            color: #ff4444;
        }

        .action-btn.download-btn {
            border-color: #10b981;
            color: #10b981;
        }

        .btn-delete-small {
            width: 32px;
            height: 32px;
            padding: 0;
            background: rgba(255, 68, 68, 0.1);
            border: 2px solid #ff4444;
            border-radius: 8px;
            color: #ff4444;
            cursor: pointer;
        }

        /* ===== TABLES ===== */
        .table-scroll {
            overflow-x: auto;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            margin-top: 15px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th, td {
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 10px 8px;
            text-align: center;
            font-size: 0.85rem;
        }

        th {
            background: linear-gradient(145deg, #002244, #001433);
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        /* ===== FILE LIST ===== */
        #fileList {
            list-style: none;
            padding: 0;
        }

        #fileList li {
            padding: 12px;
            margin: 8px 0;
            background: rgba(10, 25, 45, 0.6);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            min-width: 150px;
        }

        .file-info i {
            font-size: 1.1rem;
            color: #3b82f6;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        /* ===== POPUP MODAL ===== */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            background: rgba(5, 12, 24, 0.98);
            backdrop-filter: blur(20px);
            border: 2px solid #3b82f6;
            border-radius: 24px;
            display: none;
            z-index: 1000;
            overflow: hidden;
        }

        .popup.max {
            width: 95%;
            height: 95%;
        }

        .popup-header {
            background: linear-gradient(145deg, #002244, #001433);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            cursor: move;
        }

        .popup-header span {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .popup-body {
            padding: 20px;
            max-height: calc(90vh - 60px);
            overflow-y: auto;
        }

        /* ===== UNDO NOTIFICATION ===== */
        .undo-box {
            background: rgba(0, 40, 80, 0.9);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .undo-box button {
            width: auto;
            padding: 6px 15px;
            margin: 0;
        }

        /* ===== LOADING STATES ===== */
        .loading-row td {
            padding: 20px;
            text-align: center;
            color: #6688aa;
        }

        .fa-spin, .loader-spinner {
            animation: spin 1s linear infinite;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 10000;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #7fabff);
            transition: width 0.3s ease;
        }

        /* ===== PAGE LOADER ===== */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .page-loader.hidden {
            display: none;
        }

        .page-loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        @keyframes particles {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
            }
            .container {
                padding: 100px 12px 20px;
                flex-direction: column;
            }
            .left-section, .right-section {
                flex: 1 1 100%;
            }
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.1rem; }
            .card { padding: 15px; }
            table { min-width: 450px; }
            th, td { padding: 8px 6px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 90px 10px 15px; }
            button { padding: 10px 12px; font-size: 0.8rem; }
            table { min-width: 400px; }
            th, td { padding: 6px 4px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- ==================== LOADERS ==================== -->
    <div class="progress-bar">
        <div class="progress-bar-fill"></div>
    </div>

    <div class="page-loader" id="pageLoader">
        <div style="text-align: center;">
            <div class="page-loader-spinner"></div>
            <div style="color: white;">Loading Dashboard...</div>
        </div>
    </div>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-bolt"></i> Dutabarane
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="home.html" class="active">Control Panel</a>
            <a href="memberus.html">Member Details</a>
            <a href="aboutus.html">About Us</a>
            <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container">
        <h1>ADMIN CONTROL PANEL</h1>

        <!-- LEFT SECTION: MEMBERS -->
        <div class="left-section">
            <!-- Add Member Card -->
            <div class="card">
                <h2><i class="fas fa-users"></i> Members</h2>
                <input class="search" id="memberSearch" placeholder="Search members..." onkeyup="searchMembers(this.value)">
                <form id="memberForm">
                    <input id="mName" placeholder="Member name" required>
                    <input id="mPhone" placeholder="Phone number" required>
                    <button type="submit" id="addMemberBtn">
                        <i class="fas fa-user-plus"></i> Add Member
                    </button>
                </form>
                <div id="undoArea"></div>
            </div>

            <!-- Members List Card -->
            <div class="card">
                <button class="toggle-btn" id="toggleMembersBtn">
                    <i class="fas fa-chevron-down"></i> Show Members List
                </button>
                <div class="table-scroll" id="membersContainer" style="display: none;">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Phone</th><th>Action</th></tr>
                        </thead>
                        <tbody id="members">
                            <tr class="loading-row"><td colspan="3">Loading members...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- RIGHT SECTION: FILES -->
        <div class="right-section">
            <!-- Create File Card -->
            <div class="card">
                <h2><i class="fas fa-folder"></i> Files</h2>
                <input class="search" id="fileSearch" placeholder="Search files..." onkeyup="searchFiles(this.value)">
                <form id="fileForm">
                    <input id="fileName" placeholder="File name (e.g., January 2025)" required>
                    <button type="submit" id="createFileBtn">
                        <i class="fas fa-plus-circle"></i> Create File
                    </button>
                </form>
            </div>

            <!-- Files List Card -->
            <div class="card">
                <button class="toggle-btn" id="toggleFilesBtn">
                    <i class="fas fa-chevron-down"></i> Show Files List
                </button>
                <div class="table-scroll" id="filesContainer" style="display: none;">
                    <ul id="fileList">
                        <li class="loading-row">Loading files...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== FILE POPUP MODAL ==================== -->
    <div class="popup" id="filePopup">
        <div class="popup-header" id="popupHeader">
            <b id="currentFile"><i class="fas fa-file-alt"></i> File</b>
            <div>
                <span onclick="minPopup()">➖</span>
                <span onclick="maxPopup()">⬜</span>
                <span onclick="closePopup()">❌</span>
            </div>
        </div>
        <div class="popup-body">
            <input class="search" id="fileMemberSearch" placeholder="Search member..." onkeyup="searchFileMembers(this.value)">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr><th>Member</th><th>Amount</th><th>Loan</th><th>Interest</th></tr>
                    </thead>
                    <tbody id="fileTable">
                        <tr class="loading-row"><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="saveFileBtn" style="flex: 2;">Save</button>
                <button id="deleteFileBtn" style="flex: 1; background:rgba(255,68,68,0.1);border-color:#ff4444;color:#ff4444;">Delete</button>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="loaders.js"></script>
    <script>
        // ============================================
        // SESSION CHECK
        // ============================================
        (function checkSession() {
            const session = localStorage.getItem('dutabarane_session');
            if (!session) {
                window.location.href = 'welcome.html';
                return;
            }
            try {
                const sessionData = JSON.parse(session);
                if (sessionData.expiresAt && new Date(sessionData.expiresAt) < new Date()) {
                    localStorage.removeItem('dutabarane_session');
                    window.location.href = 'welcome.html';
                }
            } catch(e) { window.location.href = 'welcome.html'; }
        })();

        // ============================================
        // HIDE PAGE LOADER
        // ============================================
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if (loader) loader.classList.add('hidden');
            }, 500);
        });

        // ============================================
        // LOGOUT
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Logout?')) {
                localStorage.removeItem('dutabarane_session');
                window.location.href = 'welcome.html';
            }
        });

        // ============================================
        // TOGGLE FUNCTIONS (Mobile Friendly)
        // ============================================
        const toggleMembersBtn = document.getElementById('toggleMembersBtn');
        const toggleFilesBtn = document.getElementById('toggleFilesBtn');
        const membersContainer = document.getElementById('membersContainer');
        const filesContainer = document.getElementById('filesContainer');

        function toggleMembers() {
            if (membersContainer.style.display === 'none' || membersContainer.style.display === '') {
                membersContainer.style.display = 'block';
                toggleMembersBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide Members List';
                if (members.length === 0) loadMembers();
            } else {
                membersContainer.style.display = 'none';
                toggleMembersBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Show Members List';
            }
        }

        function toggleFiles() {
            if (filesContainer.style.display === 'none' || filesContainer.style.display === '') {
                filesContainer.style.display = 'block';
                toggleFilesBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide Files List';
                if (files.length === 0) loadFiles();
            } else {
                filesContainer.style.display = 'none';
                toggleFilesBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Show Files List';
            }
        }

        toggleMembersBtn.addEventListener('click', toggleMembers);
        toggleFilesBtn.addEventListener('click', toggleFiles);

        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        const BASE = "/api/";
        let members = [], files = [], currentFileId = null, lastDeleted = null;

        // ============================================
        // MEMBERS FUNCTIONS
        // ============================================
        async function loadMembers() {
            const membersBody = document.getElementById("members");
            membersBody.innerHTML = `<tr class="loading-row"><td colspan="3">Loading members...</td></tr>`;
            try {
                const r = await fetch(BASE + "members");
                members = await r.json();
                renderMembers(members);
            } catch (error) {
                membersBody.innerHTML = `<tr><td colspan="3" style="color:#ff4444;">Error loading members</td></tr>`;
            }
        }

        function renderMembers(data) {
            document.getElementById("members").innerHTML = data.map(m => `
                <tr>
                    <td>${escapeHtml(m.name)}</td>
                    <td>${escapeHtml(m.phone)}</td>
                    <td><button class="btn-delete-small" onclick="deleteMember(${m.id}, this)">✕</button></td>
                </tr>
            `).join("");
        }

        function searchMembers(v) {
            renderMembers(members.filter(m => m.name.toLowerCase().includes(v.toLowerCase())));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function deleteMember(id, button) {
            if (!confirm("Delete this member?")) return;
            lastDeleted = members.find(m => m.id === id);
            try {
                await fetch(BASE + "members/" + id, { method: "DELETE" });
                members = members.filter(m => m.id !== id);
                renderMembers(members);
                showUndo();
            } catch (error) {
                alert('Delete failed');
            }
        }

        function showUndo() {
            const undoArea = document.getElementById("undoArea");
            undoArea.innerHTML = `<div class="undo-box">Member deleted <button onclick="undoDelete()">UNDO</button></div>`;
            setTimeout(() => undoArea.innerHTML = "", 5000);
        }

        async function undoDelete() {
            if (!lastDeleted) return;
            await fetch(BASE + "members", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lastDeleted) });
            loadMembers();
            document.getElementById("undoArea").innerHTML = "";
        }

        // ============================================
        // FILES FUNCTIONS
        // ============================================
        async function loadFiles() {
            const fileList = document.getElementById("fileList");
            fileList.innerHTML = `<li class="loading-row">Loading files...</li>`;
            try {
                const r = await fetch(BASE + "files");
                files = await r.json();
                renderFiles(files);
            } catch (error) {
                fileList.innerHTML = `<li style="color:#ff4444;">Error loading files</li>`;
            }
        }

        function renderFiles(fileData) {
            const fileList = document.getElementById("fileList");
            fileList.innerHTML = fileData.map(f => `
                <li>
                    <div class="file-info" onclick="openFile(${f.id},'${escapeHtml(f.name).replace(/'/g, "\\'")}')">
                        <i class="fas fa-file-alt"></i>
                        <span class="file-name">${escapeHtml(f.name)}</span>
                    </div>
                    <div class="file-actions">
                        <button class="action-btn download-btn" onclick="downloadFile(${f.id}, '${escapeHtml(f.name).replace(/'/g, "\\'")}', this)"><i class="fas fa-download"></i></button>
                        <button class="action-btn delete-btn" onclick="deleteFileList(event, ${f.id}, this)"><i class="fas fa-trash"></i></button>
                    </div>
                </li>
            `).join("");
        }

        function searchFiles(v) {
            const items = document.querySelectorAll("#fileList li");
            items.forEach(li => {
                if (li.classList.contains('loading-row')) return;
                li.style.display = li.innerText.toLowerCase().includes(v.toLowerCase()) ? "" : "none";
            });
        }

        async function deleteFileList(e, id, button) {
            e.stopPropagation();
            if (!confirm("Delete file?")) return;
            try {
                await fetch(BASE + "files/" + id, { method: "DELETE" });
                files = files.filter(f => f.id !== id);
                renderFiles(files);
            } catch (error) {
                alert('Delete failed');
            }
        }

        async function downloadFile(fileId, fileName, button) {
            try {
                const r = await fetch(BASE + "files/" + fileId);
                const fileData = await r.json();
                let csv = "Member Name,Amount,Loan,Interest\n";
                members.forEach(m => {
                    const row = fileData[m.id] || {};
                    csv += `"${m.name}",${row.amount || ''},${row.loan || ''},${row.interest || ''}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileName.replace(/\s/g, '_')}_export.csv`;
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (error) {
                alert('Download failed');
            }
        }

        // ============================================
        // POPUP FUNCTIONS
        // ============================================
        async function openFile(id, name) {
            currentFileId = id;
            document.getElementById("currentFile").innerHTML = `<i class="fas fa-file-alt"></i> ${escapeHtml(name)}`;
            document.getElementById("filePopup").style.display = "block";
            const r = await fetch(BASE + "files/" + id);
            const data = await r.json();
            document.getElementById("fileTable").innerHTML = members.map(m => `
                <tr>
                    <td>${escapeHtml(m.name)}</td>
                    <td><input class="amount-input" value="${escapeHtml(data[m.id]?.amount || '')}" placeholder="Amount"></td>
                    <td><input class="loan-input" value="${escapeHtml(data[m.id]?.loan || '')}" placeholder="Loan"></td>
                    <td><input class="interest-input" value="${escapeHtml(data[m.id]?.interest || '')}" placeholder="Interest"></td>
                </tr>
            `).join("");
        }

        function closePopup() { document.getElementById("filePopup").style.display = "none"; }
        function minPopup() { document.getElementById("filePopup").style.display = "none"; }
        function maxPopup() { document.getElementById("filePopup").classList.toggle("max"); }

        function searchFileMembers(value) {
            value = value.toLowerCase();
            document.querySelectorAll("#fileTable tr").forEach(row => {
                row.style.display = row.children[0].innerText.toLowerCase().includes(value) ? "" : "none";
            });
        }

        async function saveFile() {
            if (!currentFileId) return;
            const payload = {};
            document.querySelectorAll("#fileTable tr").forEach((tr, i) => {
                if (members[i]) {
                    const inputs = tr.querySelectorAll("input");
                    payload[members[i].id] = {
                        amount: inputs[0]?.value || '',
                        loan: inputs[1]?.value || '',
                        interest: inputs[2]?.value || ''
                    };
                }
            });
            try {
                await fetch(BASE + "files/" + currentFileId, {
                    method: "PUT",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("Saved!");
            } catch (error) {
                alert("Save failed!");
            }
        }

        async function deleteFile() {
            if (!currentFileId) return;
            if (!confirm("Delete this file?")) return;
            try {
                await fetch(BASE + "files/" + currentFileId, { method: "DELETE" });
                closePopup();
                files = files.filter(f => f.id !== currentFileId);
                renderFiles(files);
                alert("File deleted");
            } catch (error) {
                alert("Delete failed!");
            }
        }

        // ============================================
        // FORM SUBMISSIONS
        // ============================================
        document.getElementById('memberForm').onsubmit = async e => {
            e.preventDefault();
            const name = document.getElementById('mName').value.trim();
            const phone = document.getElementById('mPhone').value.trim();
            if (!name || !phone) {
                alert('Please fill all fields');
                return;
            }
            try {
                await fetch(BASE + "members", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });
                e.target.reset();
                loadMembers();
                if (membersContainer.style.display !== 'block') toggleMembers();
            } catch (error) {
                alert('Failed to add member');
            }
        };

        document.getElementById('fileForm').onsubmit = async e => {
            e.preventDefault();
            const name = document.getElementById('fileName').value.trim();
            if (!name) {
                alert('Please enter file name');
                return;
            }
            try {
                await fetch(BASE + "files", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                e.target.reset();
                loadFiles();
                if (filesContainer.style.display !== 'block') toggleFiles();
            } catch (error) {
                alert('Failed to create file');
            }
        };

        // ============================================
        // POPUP BUTTONS
        // ============================================
        document.getElementById('saveFileBtn').onclick = saveFile;
        document.getElementById('deleteFileBtn').onclick = deleteFile;

        // ============================================
        // DRAG FUNCTIONALITY (Desktop only)
        // ============================================
        let drag = false, dx, dy;
        const popup = document.getElementById('filePopup');
        const popupHeader = document.getElementById('popupHeader');
        if (window.innerWidth > 768 && popupHeader) {
            popupHeader.onmousedown = e => {
                drag = true;
                dx = e.clientX - popup.offsetLeft;
                dy = e.clientY - popup.offsetTop;
                popup.style.transition = 'none';
            };
            document.onmousemove = e => {
                if (drag) {
                    popup.style.left = (e.clientX - dx) + "px";
                    popup.style.top = (e.clientY - dy) + "px";
                }
            };
            document.onmouseup = () => {
                drag = false;
                popup.style.transition = '';
            };
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadMembers();
        loadFiles();

        console.log('✅ Dashboard loaded - Skeleton HTML structure');
        console.log('📱 Mobile optimized with working toggles');
    </script>
</body>
</html>
