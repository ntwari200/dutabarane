<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard | Dutabarane</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f17;
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(74, 158, 255, 0.1) 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 5% 10%, #3b82f6, transparent),
                        radial-gradient(2px 2px at 15% 70%, #4a9eff, transparent),
                        radial-gradient(3px 3px at 25% 40%, #2a7fff, transparent);
            background-size: 200% 200%;
            opacity: 0.2;
            animation: floatParticles 25s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #3b82f6;
            padding: 15px 30px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #b8d1ff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(59, 130, 246, 0.2);
            color: white;
        }

        .nav-links a.active {
            background: linear-gradient(145deg, #002244, #001433);
            border: 1px solid #3b82f6;
            color: white;
        }

        .logout-nav-btn {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444 !important;
        }

        .logout-nav-btn:hover {
            background: #ff4444;
            color: white !important;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            position: relative;
            z-index: 1;
        }

        .left-section, .right-section {
            flex: 1 1 40%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
        }

        .card {
            background: rgba(5, 12, 24, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 100, 200, 0.3);
            border-radius: 24px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #3b82f6;
        }

        input, .search {
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            background: rgba(10, 25, 45, 0.6);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, .search:focus {
            border-color: #3b82f6;
            outline: none;
        }

        button {
            padding: 14px 20px;
            margin: 10px 0;
            width: 100%;
            background: linear-gradient(145deg, #002244, #001433);
            border: 2px solid #2a7fff;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        button:hover {
            background: linear-gradient(145deg, #003366, #001f4d);
            transform: translateY(-2px);
        }

        .table-scroll {
            overflow: auto;
            max-height: 350px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th, td {
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 12px 10px;
            text-align: center;
        }

        th {
            background: linear-gradient(145deg, #002244, #001433);
            color: white;
            position: sticky;
            top: 0;
        }

        .btn-delete-small {
            width: 36px;
            height: 36px;
            padding: 0;
            background: rgba(255, 68, 68, 0.1);
            border: 2px solid #ff4444;
            border-radius: 8px;
            color: #ff4444;
            cursor: pointer;
        }

        .btn-delete-small:hover {
            background: #ff4444;
            color: white;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            margin: 0;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            color: #3b82f6;
            cursor: pointer;
        }

        .action-btn.delete-btn {
            border-color: #ff4444;
            color: #ff4444;
        }

        .action-btn.download-btn {
            border-color: #10b981;
            color: #10b981;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        #fileList {
            list-style: none;
            padding: 0;
        }

        #fileList li {
            padding: 15px;
            margin: 8px 0;
            background: rgba(10, 25, 45, 0.6);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .popup {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 95%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #3b82f6;
            border-radius: 24px;
            display: none;
            z-index: 1000;
        }

        .popup.max {
            width: 95%;
            height: 95%;
            top: 2.5%;
        }

        .popup-header {
            background: linear-gradient(145deg, #002244, #001433);
            color: white;
            padding: 15px 20px;
            border-radius: 22px 22px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            cursor: move;
        }

        .popup-header span {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .popup-body {
            padding: 25px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .amount-input { border-color: #00c853; }
        .loan-input { border-color: #ff9100; }
        .interest-input { border-color: #2979ff; }

        .loading-row td {
            padding: 20px;
            text-align: center;
            color: #6688aa;
        }

        .undo-box {
            background: rgba(0, 40, 80, 0.9);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        @keyframes floatParticles {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 120px 15px 20px;
            }
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
            }
            .popup {
                top: 0;
                left: 0;
                transform: none;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.5rem; }
        }

        .simple-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .simple-loader.hidden {
            display: none;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="simple-loader" id="pageLoader">
        <div style="text-align: center;">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading Dashboard...</div>
        </div>
    </div>

    <div class="navbar">
        <div class="logo">
            <i class="fas fa-bolt"></i> Dutabarane
        </div>
        <div class="nav-links">
            <a href="home.html" class="active">Dashboard</a>
            <a href="index.html">Home</a>
            <a href="#" id="logoutNavBtn" class="logout-nav-btn">Logout</a>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <h1>ADMIN CONTROL PANEL</h1>

        <div class="left-section">
            <div class="card">
                <h2><i class="fas fa-users" style="color: #3b82f6;"></i> Members</h2>
                <input class="search" id="memberSearch" placeholder="Search members..." onkeyup="searchMembers(this.value)">
                <form id="memberForm">
                    <input id="mName" placeholder="Member name" required>
                    <input id="mPhone" placeholder="Phone number" required>
                    <button type="submit">Add Member</button>
                </form>
                <div id="undoArea"></div>
                <div class="table-scroll" id="membersScroll">
                    <table>
                        <thead><tr><th>Name</th><th>Phone</th><th>Action</th></tr></thead>
                        <tbody id="members"><tr class="loading-row"><td colspan="3">Loading members...<\/td><\/tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="card">
                <h2><i class="fas fa-folder" style="color: #3b82f6;"></i> Files</h2>
                <input class="search" id="fileSearch" placeholder="Search files..." onkeyup="searchFiles(this.value)">
                <form id="fileForm">
                    <input id="fileName" placeholder="File name" required>
                    <button type="submit">Create File</button>
                </form>
                <div class="table-scroll" id="filesScroll">
                    <ul id="fileList"><li class="loading-row">Loading files...<\/li></ul>
                </div>
            </div>
        </div>
    </div>

    <div class="popup" id="filePopup">
        <div class="popup-header" id="popupHeader">
            <b id="currentFile">File</b>
            <div><span onclick="minPopup()">➖</span><span onclick="maxPopup()">⬜</span><span onclick="closePopup()">❌</span></div>
        </div>
        <div class="popup-body">
            <input class="search" id="fileMemberSearch" placeholder="Search member..." onkeyup="searchFileMembers(this.value)">
            <div class="table-scroll" id="fileScroll">
                <table>
                    <thead><tr><th>Member</th><th>Amount</th><th>Loan</th><th>Interest</th></tr></thead>
                    <tbody id="fileTable"><tr class="loading-row"><td colspan="4">Loading...<\/td><\/tr></tbody>
                </table>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveFile()">Save</button>
                <button onclick="deleteFile()" style="background:rgba(255,68,68,0.1);border-color:#ff4444;color:#ff4444;">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Session check
        const session = localStorage.getItem('dutabarane_session');
        if (!session) {
            window.location.href = 'welcome.html';
        }

        // Hide loader and show content
        setTimeout(() => {
            document.getElementById('pageLoader').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'flex';
        }, 500);

        // Logout
        document.getElementById('logoutNavBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Logout?')) {
                localStorage.removeItem('dutabarane_session');
                window.location.href = 'welcome.html';
            }
        });

        const BASE = "/api/";
        let members = [], files = [], currentFileId = null, lastDeleted = null;

        async function loadMembers() {
            try {
                const r = await fetch(BASE + "members");
                members = await r.json();
                document.getElementById("members").innerHTML = members.map(m => `
                    <tr><td>${m.name}<\/td><td>${m.phone}<\/td><td><button class="btn-delete-small" onclick="deleteMember(${m.id})">✕<\/button><\/td><\/tr>
                `).join("");
            } catch(e) { console.error(e); }
        }

        async function deleteMember(id) {
            if (!confirm("Delete member?")) return;
            lastDeleted = members.find(m => m.id === id);
            await fetch(BASE + "members/" + id, { method: "DELETE" });
            loadMembers();
            document.getElementById("undoArea").innerHTML = `<div class="undo-box">Member deleted <button onclick="undoDelete()">UNDO</button></div>`;
            setTimeout(() => document.getElementById("undoArea").innerHTML = "", 5000);
        }

        async function undoDelete() {
            if (!lastDeleted) return;
            await fetch(BASE + "members", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lastDeleted) });
            loadMembers();
            document.getElementById("undoArea").innerHTML = "";
        }

        function searchMembers(v) {
            const filtered = members.filter(m => m.name.toLowerCase().includes(v.toLowerCase()));
            document.getElementById("members").innerHTML = filtered.map(m => `<tr><td>${m.name}<\/td><td>${m.phone}<\/td><td><button class="btn-delete-small" onclick="deleteMember(${m.id})">✕<\/button><\/td><\/tr>`).join("");
        }

        async function loadFiles() {
            try {
                const r = await fetch(BASE + "files");
                files = await r.json();
                document.getElementById("fileList").innerHTML = files.map(f => `
                    <li>
                        <div class="file-info" onclick="openFile(${f.id},'${f.name.replace(/'/g, "\\'")}')">
                            <i class="fas fa-file-alt"></i> ${f.name}
                        </div>
                        <div class="file-actions">
                            <button class="action-btn download-btn" onclick="downloadFile(${f.id}, '${f.name.replace(/'/g, "\\'")}')"><i class="fas fa-download"></i><\/button>
                            <button class="action-btn delete-btn" onclick="deleteFileList(event, ${f.id})"><i class="fas fa-trash"></i><\/button>
                        </div>
                    <\/li>
                `).join("");
            } catch(e) { console.error(e); }
        }

        async function deleteFileList(e, id) {
            e.stopPropagation();
            if (!confirm("Delete file?")) return;
            await fetch(BASE + "files/" + id, { method: "DELETE" });
            loadFiles();
        }

        function searchFiles(v) {
            const items = document.querySelectorAll("#fileList li");
            items.forEach(li => {
                li.style.display = li.innerText.toLowerCase().includes(v.toLowerCase()) ? "" : "none";
            });
        }

        async function openFile(id, name) {
            currentFileId = id;
            document.getElementById("currentFile").innerHTML = name;
            document.getElementById("filePopup").style.display = "block";
            const r = await fetch(BASE + "files/" + id);
            const data = await r.json();
            document.getElementById("fileTable").innerHTML = members.map(m => `
                <tr>
                    <td>${m.name}<\/td>
                    <td><input class="amount-input" value="${data[m.id]?.amount || ''}"><\/td>
                    <td><input class="loan-input" value="${data[m.id]?.loan || ''}"><\/td>
                    <td><input class="interest-input" value="${data[m.id]?.interest || ''}"><\/td>
                <\/tr>
            `).join("");
        }

        function closePopup() { document.getElementById("filePopup").style.display = "none"; }
        function minPopup() { document.getElementById("filePopup").style.display = "none"; }
        function maxPopup() { document.getElementById("filePopup").classList.toggle("max"); }
        function searchFileMembers(v) {
            v = v.toLowerCase();
            document.querySelectorAll("#fileTable tr").forEach(row => {
                row.style.display = row.children[0].innerText.toLowerCase().includes(v) ? "" : "none";
            });
        }

        async function saveFile() {
            const payload = {};
            document.querySelectorAll("#fileTable tr").forEach((tr, i) => {
                if (members[i]) payload[members[i].id] = {
                    amount: tr.querySelectorAll("input")[0]?.value || '',
                    loan: tr.querySelectorAll("input")[1]?.value || '',
                    interest: tr.querySelectorAll("input")[2]?.value || ''
                };
            });
            await fetch(BASE + "files/" + currentFileId, { method: "PUT", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            alert("Saved!");
        }

        async function deleteFile() {
            if (!confirm("Delete file?")) return;
            await fetch(BASE + "files/" + currentFileId, { method: "DELETE" });
            closePopup();
            loadFiles();
        }

        async function downloadFile(fileId, fileName) {
            const r = await fetch(BASE + "files/" + fileId);
            const fileData = await r.json();
            let csv = "Member Name,Amount,Loan,Interest\n";
            members.forEach(m => { const row = fileData[m.id] || {}; csv += `"${m.name}",${row.amount || ''},${row.loan || ''},${row.interest || ''}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${fileName.replace(/\s/g, '_')}_export.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        document.getElementById('memberForm').onsubmit = async e => {
            e.preventDefault();
            await fetch(BASE + "members", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: mName.value, phone: mPhone.value }) });
            e.target.reset();
            loadMembers();
        };

        document.getElementById('fileForm').onsubmit = async e => {
            e.preventDefault();
            await fetch(BASE + "files", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: fileName.value }) });
            e.target.reset();
            loadFiles();
        };

        loadMembers();
        loadFiles();
    </script>
</body>
</html>
