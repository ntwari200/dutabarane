<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard | Dutabarane</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f17;
            color: white;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 12, 24, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #3b82f6;
            padding: 15px 30px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #b8d1ff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(59, 130, 246, 0.2);
            color: white;
        }

        .nav-links a.active {
            background: linear-gradient(145deg, #002244, #001433);
            border: 1px solid #3b82f6;
            color: white;
        }

        .logout-nav-btn {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444 !important;
        }

        .logout-nav-btn:hover {
            background: #ff4444;
            color: white !important;
        }

        /* Dashboard Container */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-section h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #4a9eff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(5, 12, 24, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 100, 200, 0.3);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            color: #3b82f6;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #99bbee;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quick-actions {
            background: rgba(5, 12, 24, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 100, 200, 0.3);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .quick-actions h2 {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            background: linear-gradient(145deg, #002244, #001433);
            border: 2px solid #2a7fff;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn:hover {
            background: linear-gradient(145deg, #003366, #001f4d);
            transform: translateY(-2px);
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #002244, #001433);
            border: 2px solid #3b82f6;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .refresh-btn:hover {
            transform: rotate(180deg);
        }

        .last-updated {
            text-align: center;
            margin-top: 20px;
            color: #6688aa;
            font-size: 0.8rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
            }
            .dashboard-container {
                padding: 140px 15px 30px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .stat-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-bolt"></i> Dutabarane
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="home.html">Control Panel</a>
            <a href="aboutus.html">About Us</a>
            <a href="contactus.html">Contact</a>
            <a href="#" id="logoutBtn" class="logout-nav-btn">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-section">
            <h1>Welcome, <span id="usernameDisplay">Admin</span>!</h1>
            <p>Here's an overview of your cooperative's performance</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="totalMembers">--</div>
                <div class="stat-label">Total Members</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                <div class="stat-value" id="totalAmount">--</div>
                <div class="stat-label">Total Amount (RWF)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-hand-holding-usd"></i></div>
                <div class="stat-value" id="totalLoan">--</div>
                <div class="stat-label">Total Loan (RWF)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-percent"></i></div>
                <div class="stat-value" id="totalInterest">--</div>
                <div class="stat-label">Total Interest (RWF)</div>
            </div>
        </div>

        <div class="quick-actions">
            <h2><i class="fas fa-bolt"></i> Quick Actions</h2>
            <div class="action-buttons">
                <button class="action-btn" id="quickAddMember"><i class="fas fa-user-plus"></i> Add Member</button>
                <button class="action-btn" id="quickCreateFile"><i class="fas fa-folder-plus"></i> Create File</button>
                <button class="action-btn" id="quickRefresh"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">Last updated: --:--:--</div>
    </div>

    <button class="refresh-btn" id="floatingRefresh" title="Refresh Data">
        <i class="fas fa-sync-alt"></i>
    </button>

    <script>
        // ============================================
        // SESSION CHECK
        // ============================================
        const username = localStorage.getItem("username");
        const isLoggedIn = localStorage.getItem("loggedIn");

        if (!isLoggedIn) {
            window.location.href = "index.html";
        }

        document.getElementById("usernameDisplay").textContent = username || "Admin";

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem("loggedIn");
                localStorage.removeItem("username");
                window.location.href = "index.html";
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            logout();
        });

        // ============================================
        // API CONFIGURATION
        // ============================================
        const BASE = "/api/";

        // ============================================
        // FETCH AND UPDATE DASHBOARD
        // ============================================
        async function updateDashboard() {
            console.log('🔄 Updating dashboard...');
            
            // Show loading
            document.getElementById('totalMembers').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            document.getElementById('totalAmount').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            document.getElementById('totalLoan').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            document.getElementById('totalInterest').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                // Get members count
                const membersRes = await fetch(BASE + "members");
                const members = await membersRes.json();
                const totalMembers = members.length;
                
                // Get files
                const filesRes = await fetch(BASE + "files");
                const files = await filesRes.json();
                
                let totalAmount = 0;
                let totalLoan = 0;
                let totalInterest = 0;
                
                // Calculate totals from all files
                for (const file of files) {
                    const fileRes = await fetch(BASE + "files/" + file.id);
                    const fileData = await fileRes.json();
                    
                    for (const memberId in fileData) {
                        const data = fileData[memberId];
                        totalAmount += parseFloat(data.amount) || 0;
                        totalLoan += parseFloat(data.loan) || 0;
                        totalInterest += parseFloat(data.interest) || 0;
                    }
                }
                
                // Update display
                document.getElementById('totalMembers').innerHTML = totalMembers.toLocaleString();
                document.getElementById('totalAmount').innerHTML = totalAmount.toLocaleString();
                document.getElementById('totalLoan').innerHTML = totalLoan.toLocaleString();
                document.getElementById('totalInterest').innerHTML = totalInterest.toLocaleString();
                
                // Update time
                const now = new Date();
                document.getElementById('lastUpdated').innerHTML = `Last updated: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
                
                console.log('✅ Dashboard updated:', { totalMembers, totalAmount, totalLoan, totalInterest });
                
            } catch (error) {
                console.error('Error updating dashboard:', error);
                document.getElementById('totalMembers').innerHTML = 'Error';
                document.getElementById('totalAmount').innerHTML = 'Error';
                document.getElementById('totalLoan').innerHTML = 'Error';
                document.getElementById('totalInterest').innerHTML = 'Error';
            }
        }

        // ============================================
        // REFRESH FUNCTION
        // ============================================
        async function refreshDashboard() {
            await updateDashboard();
            alert('Dashboard refreshed!');
        }

        // ============================================
        // QUICK ACTIONS
        // ============================================
        document.getElementById('quickAddMember').addEventListener('click', function() {
            window.location.href = 'home.html';
        });
        
        document.getElementById('quickCreateFile').addEventListener('click', function() {
            window.location.href = 'home.html';
        });
        
        document.getElementById('quickRefresh').addEventListener('click', function() {
            refreshDashboard();
        });
        
        document.getElementById('floatingRefresh').addEventListener('click', function() {
            refreshDashboard();
        });

        // ============================================
        // AUTO-REFRESH EVERY 30 SECONDS
        // ============================================
        updateDashboard();
        setInterval(updateDashboard, 30000);
        
        console.log('✅ Dashboard ready - Auto-refresh every 30 seconds');
    </script>
</body>
</html>
